services:
  - type: web
    name: profile-app
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: profile-db
          property: connectionString
      - key: PORT
        value: 3000

databases:
  - name: profile-db
    plan: starter
    databaseName: profile
    user: app
